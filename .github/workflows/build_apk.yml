name: Build Project Shield Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Persistent Android Signing Key
        run: |
          mkdir -p ~/.android
          if [ ! -f flutter_shield/shield.keystore ]; then
            echo "Generating permanent keystore for the first time..."
            keytool -genkeypair -v \
              -keystore flutter_shield/shield.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f flutter_shield/shield.keystore
            git commit -m "chore: save permanent Android signing keystore [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
          cp flutter_shield/shield.keystore ~/.android/debug.keystore

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Assemble Clean Flutter Project & Configure Android
        run: |
          rm -rf /tmp/shield_build
          flutter create --org com.projectshield.trader --project-name shield --platforms android /tmp/shield_build
          rm -rf /tmp/shield_build/test /tmp/shield_build/analysis_options.yaml
          cp flutter_shield/pubspec.yaml /tmp/shield_build/pubspec.yaml
          cp flutter_shield/lib/*.dart /tmp/shield_build/lib/

          cat << 'PYEOF' > /tmp/patch_android.py
          import glob, os, re

          p = "/tmp/shield_build/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:allowBackup="false"')
          open(p, "w").write(s)

          for gf in glob.glob("/tmp/shield_build/android/**/*.gradle*", recursive=True):
              txt = open(gf).read()
              txt = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[0-9.]+(["\'])', r'\g<1>1.9.24\2', txt)
              txt = re.sub(r'(ext\.kotlin_version\s*=\s*["\'])[0-9.]+(["\'])', r'\g<1>1.9.24\2', txt)
              open(gf, "w").write(txt)

          ctrl = "/tmp/shield_build/lib/shield_controller.dart"
          if os.path.exists(ctrl):
              c_txt = open(ctrl, encoding="utf-8").read()
              c_txt = c_txt.replace(".then((_) => scanNews(force: true))", ".then((_) => scanNews())")
              open(ctrl, "w", encoding="utf-8").write(c_txt)
          PYEOF
          python3 /tmp/patch_android.py

      - name: Analyze & Compile Release APK
        working-directory: /tmp/shield_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectShield-v4-APK
          path: /tmp/shield_build/build/app/outputs/flutter-apk/app-release.apk
