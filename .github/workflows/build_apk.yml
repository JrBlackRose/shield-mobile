name: Build Project Shield Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Persistent Android Signing Key
        run: |
          mkdir -p ~/.android
          if [ ! -f flutter_shield/shield.keystore ]; then
            keytool -genkeypair -v \
              -keystore flutter_shield/shield.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f flutter_shield/shield.keystore
            git commit -m "chore: save permanent Android signing keystore [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
          cp flutter_shield/shield.keystore ~/.android/debug.keystore

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Assemble Clean Flutter Project & Configure Android Native Bridge
        run: |
          rm -rf /tmp/shield_build
          flutter create --org com.projectshield.trader --project-name shield --platforms android /tmp/shield_build
          rm -rf /tmp/shield_build/test /tmp/shield_build/analysis_options.yaml
          cp flutter_shield/pubspec.yaml /tmp/shield_build/pubspec.yaml
          cp flutter_shield/lib/*.dart /tmp/shield_build/lib/

          cat << 'PYEOF' > /tmp/patch_android.py
          import glob, os, re

          p = "/tmp/shield_build/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>'''
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", perms + '\n    <application android:allowBackup="false"')
          open(p, "w").write(s)

          for gf in glob.glob("/tmp/shield_build/android/**/*.gradle*", recursive=True):
              txt = open(gf).read()
              txt = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[0-9.]+(["\'])', r'\g<1>1.9.24\2', txt)
              txt = re.sub(r'(ext\.kotlin_version\s*=\s*["\'])[0-9.]+(["\'])', r'\g<1>1.9.24\2', txt)
              open(gf, "w").write(txt)

          # Write Native Kotlin MethodChannel for OS Notifications & Background WakeLock
          kt_files = glob.glob("/tmp/shield_build/android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              kt_code = '''package com.projectshield.trader.shield

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "shield/native"
              private val CHANNEL_ID = "shield_high_alerts"
              private var wakeLock: PowerManager.WakeLock? = null
              private var notifId = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createNotificationChannel()
                  requestNotificationPermission()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "notify" -> {
                              val title = call.argument<String>("title") ?: "Project Shield Alert"
                              val body = call.argument<String>("body") ?: ""
                              showNotification(title, body)
                              result.success(true)
                          }
                          "startBackground" -> {
                              acquireWakeLock()
                              requestIgnoreBatteryOptimizations()
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Shield Autonomous Alerts",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "High-priority alerts and autonomous trade notifications"
                          enableVibration(true)
                      }
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
              }

              private fun showNotification(title: String, body: String) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                  nm.notify(notifId++, builder.build())
              }

              private fun acquireWakeLock() {
                  if (wakeLock == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Shield::AutonomousWakeLock")
                      wakeLock?.acquire()
                  }
              }

              private fun requestIgnoreBatteryOptimizations() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }
              }
          }
          '''
              open(kt_files[0], "w").write(kt_code)
          PYEOF
          python3 /tmp/patch_android.py

      - name: Analyze & Compile Release APK
        working-directory: /tmp/shield_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectShield-v4-APK
          path: /tmp/shield_build/build/app/outputs/flutter-apk/app-release.apk
