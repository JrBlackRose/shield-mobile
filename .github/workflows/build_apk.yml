name: Build Project Shield Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Scaffold Android, Bump Kotlin & Inject Permissions
        run: |
          cp flutter_shield/lib/main.dart /tmp/main.dart
          cp flutter_shield/pubspec.yaml /tmp/pubspec.yaml
          rm -rf flutter_shield
          flutter create --org com.projectshield.trader --project-name shield --platforms android flutter_shield
          cp /tmp/main.dart flutter_shield/lib/main.dart
          cp /tmp/pubspec.yaml flutter_shield/pubspec.yaml
          rm -rf flutter_shield/test
          python3 -c '
          import glob, re
          p = "flutter_shield/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application android:allowBackup=\"false\"")
          open(p, "w").write(s)

          for gf in glob.glob("flutter_shield/android/**/*.gradle*", recursive=True):
              txt = open(gf).read()
              txt = re.sub(r"(id\s+[\"'\'']org\.jetbrains\.kotlin\.android[\"'\'']\s+version\s+[\"'\''])[0-9.]+([\"'\''])", r"\g<1>1.9.24\2", txt)
              txt = re.sub(r"(ext\.kotlin_version\s*=\s*[\"'\''])[0-9.]+([\"'\''])", r"\g<1>1.9.24\2", txt)
              open(gf, "w").write(txt)
          '

      - name: Compile Release APK
        run: |
          cd flutter_shield
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectShield-v3-APK
          path: flutter_shield/build/app/outputs/flutter-apk/app-release.apk
