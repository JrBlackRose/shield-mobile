name: Build Project Shield Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Android APK
        run: |
          cd flutter_shield
          flutter create . --org com.projectshield.trader
          flutter pub add http shared_preferences
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectShield-Release-APK
          path: flutter_shield/build/app/outputs/flutter-apk/app-release.apk
