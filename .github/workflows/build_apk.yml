name: Build Project Shield Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Assemble Clean Flutter Project & Configure Android
        run: |
          rm -rf /tmp/shield_build
          flutter create --org com.projectshield.trader --project-name shield --platforms android /tmp/shield_build
          rm -rf /tmp/shield_build/test /tmp/shield_build/analysis_options.yaml
          cp flutter_shield/pubspec.yaml /tmp/shield_build/pubspec.yaml
          cp flutter_shield/lib/*.dart /tmp/shield_build/lib/

          cat << 'PYEOF' > /tmp/patch_android.py
          import glob, re

          p = "/tmp/shield_build/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:allowBackup="false"')
          open(p, "w").write(s)

          for gf in glob.glob("/tmp/shield_build/android/**/*.gradle*", recursive=True):
              txt = open(gf).read()
              txt = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[0-9.]+(["\'])', r'\g<1>1.9.24\2', txt)
              txt = re.sub(r'(ext\.kotlin_version\s*=\s*["\'])[0-9.]+(["\'])', r'\g<1>1.9.24\2', txt)
              open(gf, "w").write(txt)
          PYEOF
          python3 /tmp/patch_android.py

      - name: Analyze & Compile Release APK
        working-directory: /tmp/shield_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectShield-v4-APK
          path: /tmp/shield_build/build/app/outputs/flutter-apk/app-release.apk
